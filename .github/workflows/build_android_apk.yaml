name: Build Android Cobalt APK

on:
  push:
    branches:
      - smarttube-zoom
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-arm64:
    name: Build Cobalt APK (android-arm64 qa)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Initial Disk Space ==="
          df -h

          echo "Removing unneeded packages and runtimes..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Install System Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            curl \
            git \
            python3-dev \
            pkgconf \
            libglib2.0-0 \
            libnss3 \
            gperf \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libxtst6 \
            libgbm1 \
            libasound2t64 \
            libxkbcommon0 \
            libpango-1.0-0 \
            gcc-multilib \
            zstd \
            xz-utils \
            jq

          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone and Bootstrap Depot Tools
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$GITHUB_WORKSPACE/depot_tools"

          export DEPOT_TOOLS_DIR="$GITHUB_WORKSPACE/depot_tools"

          chmod +x "$DEPOT_TOOLS_DIR/ensure_bootstrap"
          "$DEPOT_TOOLS_DIR/ensure_bootstrap"

          test -s "$DEPOT_TOOLS_DIR/python3_bin_reldir.txt"

          echo "Depot tools Python:"
          "$DEPOT_TOOLS_DIR/python-bin/python3" \
            -c 'import sys; print(sys.executable); print(sys.version)'

          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Setup Workspace and gclient Config
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/cobalt"

          cd "$GITHUB_WORKSPACE/cobalt"

          "$GITHUB_WORKSPACE/depot_tools/gclient" config \
            --name=src \
            --unmanaged \
            "${{ github.server_url }}/${{ github.repository }}.git"

          echo "target_os = ['android']" >> .gclient
          echo "target_cpu = ['arm64']" >> .gclient

          echo "=== .gclient ==="
          cat .gclient

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: cobalt/src
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Sync Dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/cobalt"

          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"

          gclient sync \
            --verbose \
            --shallow \
            --no-history \
            --nohooks \
            --force \
            --delete_unversioned_trees

          gclient runhooks --verbose

      # The Cobalt DEPS file conditionally skips these CIPD tools when the
      # primary checkout is a Git source. Install the exact versions pinned
      # by this checkout's DEPS file.

      - name: Install Pinned GN
        shell: bash
        run: |
          set -euo pipefail

          GN_VERSION="git_revision:ebc8f16ca7b0d36a3e532ee90896f9eb48e5423b"

          GN_TMP="$RUNNER_TEMP/cobalt-gn"
          GN_DEST="$GITHUB_WORKSPACE/cobalt/src/buildtools/linux64"

          rm -rf "$GN_TMP"
          mkdir -p "$GN_TMP"

          "$GITHUB_WORKSPACE/depot_tools/cipd" install \
            "gn/gn/linux-amd64" \
            "$GN_VERSION" \
            -root "$GN_TMP"

          echo "=== Downloaded GN ==="
          find "$GN_TMP" -maxdepth 3 -type f -name "gn" -ls

          GN_BINARY="$(find "$GN_TMP" -type f -name gn -print -quit)"

          if [ -z "$GN_BINARY" ]; then
            echo "ERROR: GN binary was not downloaded."
            exit 1
          fi

          echo "GN binary: $GN_BINARY"

          # The Cobalt checkout's buildtools directory may have been
          # created by a hook with restrictive ownership/permissions.
          sudo mkdir -p "$GN_DEST"
          sudo chown -R "$USER:$USER" "$GN_DEST"

          install -m 0755 "$GN_BINARY" "$GN_DEST/gn"

          echo "=== Installed GN ==="
          ls -lh "$GN_DEST/gn"

          "$GN_DEST/gn" --version
          
      - name: Install Pinned Ninja
        shell: bash
        run: |
          set -euo pipefail

          NINJA_VERSION="version:3@1.12.1.chromium.4"

          NINJA_TMP="$RUNNER_TEMP/cobalt-ninja"
          NINJA_DEST="$GITHUB_WORKSPACE/cobalt/src/third_party/ninja"

          rm -rf "$NINJA_TMP"
          mkdir -p "$NINJA_TMP"

          "$GITHUB_WORKSPACE/depot_tools/cipd" install \
            "infra/3pp/tools/ninja/linux-amd64" \
            "$NINJA_VERSION" \
            -root "$NINJA_TMP"

          echo "=== Downloaded Ninja ==="
          find "$NINJA_TMP" -maxdepth 3 -type f -name "ninja" -ls

          NINJA_BINARY="$(find "$NINJA_TMP" -type f -name ninja -print -quit)"

          if [ -z "$NINJA_BINARY" ]; then
            echo "ERROR: Ninja binary was not downloaded."
            exit 1
          fi

          echo "Ninja binary: $NINJA_BINARY"

          sudo mkdir -p "$NINJA_DEST"
          sudo chown -R "$USER:$USER" "$NINJA_DEST"

          install -m 0755 "$NINJA_BINARY" "$NINJA_DEST/ninja"

          echo "=== Installed Ninja ==="
          ls -lh "$NINJA_DEST/ninja"

          "$NINJA_DEST/ninja" --version

      - name: Install Pinned Siso
        shell: bash
        run: |
          set -euo pipefail

          SISO_VERSION="git_revision:080102c196eef824a444b70272cb6d645b6abe09"

          SISO_TMP="$RUNNER_TEMP/cobalt-siso"
          SISO_DEST="$GITHUB_WORKSPACE/cobalt/src/third_party/siso/cipd"

          rm -rf "$SISO_TMP"
          mkdir -p "$SISO_TMP"

          "$GITHUB_WORKSPACE/depot_tools/cipd" install \
            "infra/build/siso/linux-amd64" \
            "$SISO_VERSION" \
            -root "$SISO_TMP"

          echo "=== Downloaded Siso ==="
          find "$SISO_TMP" -maxdepth 3 -type f -name "siso" -ls

          SISO_BINARY="$(find "$SISO_TMP" -type f -name siso -print -quit)"

          if [ -z "$SISO_BINARY" ]; then
            echo "ERROR: Siso binary was not downloaded."
            exit 1
          fi

          echo "Siso binary: $SISO_BINARY"

          sudo mkdir -p "$SISO_DEST"
          sudo chown -R "$USER:$USER" "$SISO_DEST"

          install -m 0755 "$SISO_BINARY" "$SISO_DEST/siso"

          echo "=== Installed Siso ==="
          ls -lh "$SISO_DEST/siso"

          "$SISO_DEST/siso" help >/dev/null

          echo "Siso installation successful."

      - name: Verify Android Build Toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/cobalt/src/buildtools/linux64:$GITHUB_WORKSPACE/cobalt/src/third_party/ninja:$GITHUB_WORKSPACE/cobalt/src/third_party/siso/cipd:$GITHUB_WORKSPACE/depot_tools:$PATH"

          echo "=== Android SDK ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK found at $ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK found at $ANDROID_SDK_ROOT"
          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "=== Tool locations ==="

          command -v python3
          command -v gn
          command -v ninja
          command -v autoninja

          echo "=== GN ==="
          gn --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Siso ==="
          "$GITHUB_WORKSPACE/cobalt/src/third_party/siso/cipd/siso" help >/dev/null

          echo "=== Build toolchain OK ==="

      - name: Generate GN Build Files
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/cobalt/src"

          export PATH="$GITHUB_WORKSPACE/cobalt/src/buildtools/linux64:$GITHUB_WORKSPACE/cobalt/src/third_party/ninja:$GITHUB_WORKSPACE/cobalt/src/third_party/siso/cipd:$GITHUB_WORKSPACE/depot_tools:$PATH"

          test -s \
            "$GITHUB_WORKSPACE/depot_tools/python3_bin_reldir.txt"

          python3 cobalt/build/gn.py \
            -p android-arm64 \
            -C qa \
            --no-rbe
            
      - name: Create Android Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"

          if [ ! -f "$KEYSTORE" ]; then
            echo "Creating Android debug keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Android debug keystore already exists."
          fi

          echo "=== Debug Keystore ==="
          ls -lh "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

      - name: Compile Cobalt APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/cobalt/src"

          export PATH="$GITHUB_WORKSPACE/cobalt/src/buildtools/linux64:$GITHUB_WORKSPACE/cobalt/src/third_party/ninja:$GITHUB_WORKSPACE/cobalt/src/third_party/siso/cipd:$GITHUB_WORKSPACE/depot_tools:$PATH"

          time autoninja \
            -C out/android-arm64_qa \
            cobalt_apk

      - name: Find and Validate Produced APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Locating Built APK Files ==="

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find \
            "$GITHUB_WORKSPACE/cobalt/src/out/android-arm64_qa" \
            -name "*.apk" \
            -ls

          found=0

          while IFS= read -r apk_file; do
            echo "Found APK: $apk_file"

            cp "$apk_file" "$GITHUB_WORKSPACE/artifacts/"

            found=1
          done < <(
            find \
              "$GITHUB_WORKSPACE/cobalt/src/out/android-arm64_qa" \
              -name "*.apk"
          )

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          echo "=== Artifacts ready ==="
          ls -la "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload Cobalt APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cobalt_android-arm64_qa_APK
          path: artifacts/*.apk
          if-no-files-found: error
